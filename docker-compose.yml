services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: devsubank-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "DevSu*Bank2026"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  customers-api:
    build:
      context: ./src/customers
      dockerfile: DevSu.Bank.Customers.Presentation.Api/Dockerfile
    container_name: devsubank-customers-api
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
      Host: "sqlserver"
      Database: "DevSuBankCustomers"
      User: "sa"
      Password: "DevSu*Bank2026"
    ports:
      - "5001:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  accounts-api:
    build:
      context: ./src/accounts
      dockerfile: DevSu.Bank.Accounts.Presentation.Api/Dockerfile
    container_name: devsubank-accounts-api
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
      Host: "sqlserver"
      Database: "DevSuBankAccounts"
      User: "sa"
      Password: "DevSu*Bank2026"
    ports:
      - "5002:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  sqlserver-data:
